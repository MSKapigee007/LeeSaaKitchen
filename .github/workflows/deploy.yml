name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npx ng build --output-path=dist --base-href=/

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p dist/site
          if [ -d "dist/browser" ]; then
            cp -r dist/browser/* dist/site/
          else
            cp -r dist/* dist/site/
          fi
          # Ensure CNAME for custom domain
          echo "blog.augustacloudkitchen.com" > dist/site/CNAME
          # Ensure 404 fallback for Angular single-page routing
          cp dist/site/index.html dist/site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
